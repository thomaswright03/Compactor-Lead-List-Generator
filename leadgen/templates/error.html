<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · AARCO Compactor Lead Finder</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
{% include "_theme.html" %}
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--side);
         font:var(--fs-base)/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  main { flex:1; display:grid; place-items:center; padding:var(--sp-5) var(--sp-4); }
  .box { width:min(460px,100%); background:var(--card); border-radius:var(--r-lg); padding:var(--sp-6);
         box-shadow:0 20px 60px var(--shadow); }
  .brand strong { display:block; font-size:var(--fs-md); }
  .brand span { color:var(--muted); font-size:var(--fs-sm); }
  h1 { font-size:var(--fs-lg); margin:var(--sp-5) 0 var(--sp-2); }
  p { margin:0 0 var(--sp-5); color:var(--muted); font-size:var(--fs-md); }
  .code { font-size:var(--fs-sm); color:var(--muted); margin-top:var(--sp-4); }
  a.btn { display:inline-block; font-weight:600; border-radius:var(--r-sm); padding:var(--sp-3) var(--sp-4); background:var(--btn);
          color:var(--btn-ink); text-decoration:none; min-height:44px; }
  a.btn:focus-visible { outline:3px solid var(--accent-2); outline-offset:2px; }
  footer { text-align:center; color:var(--side-ink); font-size:var(--fs-sm); padding:var(--sp-4); }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="brand"><strong>AARCO Compactor</strong><span>Lead Finder</span></div>
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <a class="btn" href="/">Back to Lead Finder</a>
    <div class="code">Error {{ code }}</div>
  </div>
</main>
<footer>© {{ year }} Wright AI Solutions. All rights reserved.</footer>
</body>
</html>
