<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Arco Compactor Lead Finder</title>
<link rel="icon" href="data:,">
{% include "_theme.html" %}
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--side);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  main { flex:1; display:grid; place-items:center; padding:24px 16px; }
  .box { width:min(460px,100%); background:var(--card); border-radius:14px; padding:28px;
         box-shadow:0 20px 60px var(--shadow); }
  .brand strong { display:block; font-size:18px; }
  .brand span { color:var(--muted); font-size:13px; }
  h1 { font-size:22px; margin:22px 0 6px; }
  p { margin:0 0 20px; color:var(--muted); }
  .code { font-size:12px; color:var(--muted); margin-top:18px; }
  a.btn { display:inline-block; font-weight:600; border-radius:7px; padding:11px 18px; background:var(--btn);
          color:var(--btn-ink); text-decoration:none; min-height:44px; }
  a.btn:focus-visible { outline:3px solid var(--accent-2); outline-offset:2px; }
  footer { text-align:center; color:var(--side-ink); font-size:12px; padding:16px; }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="brand"><strong>Arco Compactor</strong><span>Lead Finder</span></div>
    <h1>{{ title }}</h1>
    <p>{{ text }}</p>
    <a class="btn" href="/">Back to Lead Finder</a>
    <div class="code">Error {{ code }}</div>
  </div>
</main>
<footer>© {{ year }} Wright AI Solutions. All rights reserved.</footer>
</body>
</html>
