<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compactor Lead Finder</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e4e7ec;
          --accent:#1f4e78; --a:#c6efce; --b:#e2efda; --c:#fff2cc; --d:#f2f2f2; --comp:#f8cbad; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 24px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; opacity:.85; }
  main { padding:20px 24px; max-width:1400px; margin:0 auto; }
  form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px;
         display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:12px; color:var(--muted); }
  input, select { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
  label.check { flex-direction:row; align-items:center; gap:6px; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 14px;
                 font:inherit; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { margin:16px 0 8px; color:var(--muted); min-height:20px; }
  #status.error { color:#b42318; font-weight:600; }
  .warn { background:#fffaeb; border:1px solid #fedf89; padding:8px 12px; border-radius:6px; margin:6px 0; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .stats { display:flex; flex-wrap:wrap; gap:6px; }
  .stats span { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; white-space:nowrap; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; min-width:1240px; table-layout:fixed; }
  col.c-score { width:74px; } col.c-name { width:210px; } col.c-cat { width:150px; }
  col.c-addr { width:180px; } col.c-phone { width:122px; } col.c-site { width:160px; }
  col.c-miles { width:58px; }       /* the Why column takes the rest */
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#eef2f6; position:sticky; top:0; font-size:12px; }
  tr.A td:first-child { background:var(--a); } tr.B td:first-child { background:var(--b); }
  tr.C td:first-child { background:var(--c); } tr.D td:first-child { background:var(--d); }
  tr.competitor td { background:var(--comp); }
  .nowrap { white-space:nowrap; }
  .flag { color:#b42318; font-weight:600; font-size:12px; }
  .why { color:var(--muted); font-size:12px; }
  details summary { cursor:pointer; color:var(--accent); font-size:12px; }
  td.site a { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reasons { display:flex; flex-direction:column; gap:4px; }
  .reason { display:flex; gap:8px; align-items:baseline; font-size:13px; line-height:1.35; }
  .pts { flex:0 0 38px; text-align:center; font-weight:700; font-size:11px; border-radius:999px;
         padding:1px 0; background:#e3f3e8; color:#146c43; font-variant-numeric:tabular-nums; }
  .pts.neg { background:#fdecea; color:#b42318; }
  .pts.zero { background:#f2f4f7; color:var(--muted); }
  .explain { margin-top:5px; }
  .explain p { margin:4px 0 0; color:var(--muted); font-size:12px; line-height:1.4; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Compactor &amp; Baler Lead Finder</h1>
  <p>Businesses likely to run large commercial compactors or balers. Built for Arco Compactor.</p>
</header>
<main>
  <form id="form">
    <label>Location (ZIP, city, or lat,lon)
      <input name="location" value="{{ defaults.location }}"></label>
    <label>Radius (miles)
      <input name="radius" type="number" min="1" max="100" step="1" value="{{ defaults.radius|int }}"></label>
    <label>Keywords (comma separated)
      <input name="keywords" value="{{ defaults.keywords }}"></label>
    <label>Data source
      <select name="source">
        <option value="auto">Auto (Google and/or Yelp if a key is set, plus OpenStreetMap)</option>
        <option value="osm">OpenStreetMap only (free)</option>
        <option value="yelp">Yelp only</option>
        <option value="google">Google Places only</option>
        <option value="both">Google + OpenStreetMap</option>
      </select></label>
    <label>Minimum score
      <input name="min_score" type="number" min="0" max="100" value="{{ defaults.min_score }}"></label>
    <label>Google / Yelp coverage
      <select name="grid">
        <option value="1">Standard (1 search area)</option>
        <option value="7">Wide (7 areas, more results, more cost)</option>
        <option value="19">Max (19 areas)</option>
      </select></label>
    <label>Request cap (Google / Yelp, each)
      <input name="max_requests" type="number" min="1" max="5000" placeholder="Auto"></label>
    <label class="check"><input type="checkbox" name="only_keyword_matches"> Only keyword matches</label>
    <button id="go" type="submit">Find leads</button>
  </form>

  <div id="status"></div>
  <div id="warnings"></div>
  <div id="results" hidden>
    <div class="bar">
      <a class="btn" id="dl-xlsx" href="#">Download Excel</a>
      <a class="btn" id="dl-csv" href="#">Download CSV</a>
      <input id="filter" placeholder="Filter by name, city, category..." style="flex:1;min-width:200px">
      <select id="tier">
        <option value="">All tiers</option><option>A</option><option>B</option><option>C</option><option>D</option>
      </select>
    </div>
    <div class="stats" id="stats"></div>
    <div class="table-wrap" style="margin-top:10px">
      <table>
        <colgroup><col class="c-score"><col class="c-name"><col class="c-cat"><col class="c-addr">
          <col class="c-phone"><col class="c-site"><col class="c-miles"><col class="c-why"></colgroup>
        <thead><tr><th>Score</th><th>Business</th><th>Category</th><th>Address</th>
          <th>Phone</th><th>Website</th><th>Miles</th><th>Why</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let leads = [];

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function link(href, text) {
  if (!href || !/^https?:\/\//i.test(href)) return el("span", "");
  const a = el("a", text || href.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, ""));
  a.href = href; a.target = "_blank"; a.rel = "noopener";
  return a;
}

// "+35 Grocery / supermarket (by Yelp category): Grocery stores bale..." ->
// {pts: 35, title: "Grocery / supermarket", note: "Grocery stores bale... (matched by Yelp category)"}
function parseReason(r) {
  const m = /^([+-]\d+)\s+(.*)$/.exec(r);
  if (!m) return { pts: null, title: r, note: "" };
  let title = m[2], note = "";
  const by = /^(.*?) \(by ([^)]+)\): (.*)$/.exec(title);
  if (by) { title = by[1]; note = `${by[3]} (matched by ${by[2]}).`; }
  return { pts: parseInt(m[1], 10), title: title.charAt(0).toUpperCase() + title.slice(1), note };
}

function whyCell(reasons) {
  const td = el("td");
  const list = el("div", undefined, "reasons");
  const notes = [];
  for (const r of reasons) {
    const p = parseReason(r);
    if (p.pts === null) { notes.push(p.title.charAt(0).toUpperCase() + p.title.slice(1) + "."); continue; }
    const row = el("div", undefined, "reason");
    row.title = r;
    row.append(el("span", (p.pts > 0 ? "+" : "") + p.pts,
                  "pts" + (p.pts < 0 ? " neg" : p.pts === 0 ? " zero" : "")));
    row.append(el("span", p.title));
    list.append(row);
    if (p.note) notes.unshift(p.note);
  }
  td.append(list);
  if (notes.length) {
    const d = el("details", undefined, "explain");
    d.append(el("summary", "Explain"));
    for (const n of notes) d.append(el("p", n));
    td.append(d);
  }
  return td;
}

function render() {
  const q = $("filter").value.toLowerCase();
  const tier = $("tier").value;
  const body = $("rows");
  body.replaceChildren();
  for (const l of leads) {
    const hay = [l.name, l.city, l.category, l.address, l.lead_type, l.flags.join(" ")].join(" ").toLowerCase();
    if (q && !hay.includes(q)) continue;
    if (tier && l.tier !== tier) continue;
    const tr = el("tr");
    tr.className = l.tier + (l.lead_type === "Competitor" ? " competitor" : "");
    tr.append(el("td", `${l.score} (${l.tier})`));
    const name = el("td");
    name.append(el("strong", l.name));
    if (l.lead_type !== "Prospect") name.append(el("div", l.lead_type, "why"));
    for (const f of l.flags) name.append(el("div", f, "flag"));
    tr.append(name);
    tr.append(el("td", l.category));
    const addr = el("td", [l.address, l.city, l.zip].filter(Boolean).join(", "));
    if (l.map_url) { addr.append(document.createElement("br")); addr.append(link(l.map_url, "map")); }
    tr.append(addr);
    tr.append(el("td", l.phone, "nowrap"));
    const site = el("td", undefined, "site");
    const a = link(l.website, l.website && l.website.replace(/^https?:\/\/(www\.)?/i, "").split("/")[0]);
    if (l.website) a.title = l.website;
    site.append(a); tr.append(site);
    tr.append(el("td", l.distance));
    tr.append(whyCell(l.reasons));
    body.append(tr);
  }
}

function fail(msg) {
  $("go").disabled = false;
  $("status").className = "error";
  $("status").textContent = msg;
}

async function poll(jobId) {
  let job;
  try {
    const res = await fetch(`/status/${jobId}`);
    if (!res.ok) return fail("This search is no longer available. Please run it again.");
    job = await res.json();
  } catch (err) {
    return fail("Lost contact with the server. Is it still running?");
  }
  $("status").textContent = job.message;
  if (job.state === "running") { setTimeout(() => poll(jobId), 1500); return; }
  $("go").disabled = false;
  if (job.state === "error") return fail(job.message);
  leads = job.leads;
  $("status").textContent = `${leads.length} leads near ${job.location}`;
  for (const w of job.warnings) $("warnings").append(el("div", w, "warn"));
  const stats = $("stats"); stats.replaceChildren();
  for (const [k, v] of Object.entries(job.stats)) stats.append(el("span", `${k}: ${v}`));
  $("dl-xlsx").href = `/download/${jobId}.xlsx`;
  $("dl-csv").href = `/download/${jobId}.csv`;
  $("results").hidden = false;
  render();
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  $("status").className = "";
  $("status").textContent = "Starting...";
  $("warnings").replaceChildren();
  $("results").hidden = true;
  try {
    const res = await fetch("/search", { method: "POST", body: new FormData($("form")) });
    const body = await res.json().catch(() => ({}));
    if (res.status === 429 && body.job_id) {
      $("status").textContent = "Another search is already running. Showing its progress...";
      return poll(body.job_id);
    }
    if (!res.ok) return fail(body.error || `Search failed (HTTP ${res.status})`);
    poll(body.job_id);
  } catch (err) {
    fail("Could not reach the server.");
  }
});
$("filter").addEventListener("input", render);
$("tier").addEventListener("change", render);
</script>
</body>
</html>
