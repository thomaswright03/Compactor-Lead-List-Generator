# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: compactor-lead-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: running searches live in memory. Threads serve status polls
    # while a search runs; --timeout 0 because searches can take minutes.
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD        # required: protects the page (and your API keys)
        sync: false
      - key: GOOGLE_PLACES_API_KEY   # optional
        sync: false
      - key: YELP_API_KEY            # optional
        sync: false
