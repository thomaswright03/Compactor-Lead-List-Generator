services:
  - type: web
    name: compactor-lead-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD        # required: protects the page (and your API keys)
        sync: false
      - key: GOOGLE_PLACES_API_KEY   # optional
        sync: false
      - key: YELP_API_KEY            # optional
        sync: false
      - key: REDIS_URL               # the daily Yelp call counter (see below)
        fromService:
          type: keyvalue
          name: lead-finder-counter
          property: connectionString

  # Keeps the count of today's Yelp calls (at most 50 a day) and 24 hours of
  # Yelp results. The web service's own disk is wiped when it sleeps or
  # redeploys, so the count lives here. Reachable only from this Render account.
  - type: keyvalue
    name: lead-finder-counter
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
