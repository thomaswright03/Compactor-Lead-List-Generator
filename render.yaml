services:
  - type: web
    name: compactor-lead-finder
    runtime: python
    plan: free
    # Deploy a push to main only once its GitHub checks (lint, test (sqlite), test (postgres))
    # are green: Render's Settings > Auto-Deploy > "After CI Checks Pass" (the owner's choice,
    # 2026-09-30; it needs Render's GitHub app to have access to the repository, which it now has).
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USERNAME        # the name to log in with
        sync: false
      - key: APP_PASSWORD        # required: protects the page (and your API keys)
        sync: false
      - key: ADMIN_PASSWORD      # unlocks "For the site administrator" (locked without it)
        sync: false
      - key: LEADGEN_SUPPORT_CONTACT # whom the login page names for access or a forgotten password:
        sync: false                  # a name plus a phone number or email, set in Render only
      - key: GOOGLE_PLACES_API_KEY   # optional
        sync: false
      - key: YELP_API_KEY            # optional
        sync: false
      - key: DATABASE_URL            # the permanent database (e.g. a free Neon Postgres):
        sync: false                  # saved leads, baler marks, the daily Yelp count
