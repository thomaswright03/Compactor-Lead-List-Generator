services:
  - type: web
    name: compactor-lead-finder
    runtime: python
    # Starter, not free: the free plan sleeps after 15 idle minutes and the next visit waits
    # up to a minute (the owner's choice, 2026-10-07). Starter never sleeps.
    plan: starter
    # Deploy a push to main only once its GitHub checks (lint, test (sqlite), test (postgres))
    # are green: Render's Settings > Auto-Deploy > "After CI Checks Pass" (the owner's choice,
    # 2026-09-30; it needs Render's GitHub app to have access to the repository, which it now has).
    autoDeployTrigger: checksPass
    # Render opens /livez to judge the service: it answers 200 whenever the site runs, without
    # the database. Not /healthz, which answers 503 while the database is down: on 2026-10-27
    # the database became unreachable, Render took the site out of service, and every page
    # gave Render's 502 instead of the site's own "the database isn't answering".
    healthCheckPath: /livez
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 0 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USERNAME        # the name to log in with
        sync: false
      - key: APP_PASSWORD        # required: protects the page (and your API keys)
        sync: false
      - key: ADMIN_PASSWORD      # unlocks "For the site administrator" (locked without it)
        sync: false
      - key: LEADGEN_SUPPORT_CONTACT # optional: whom the login page names for login help, instead
        sync: false                  # of the built-in contact (SUPPORT_CONTACT in leadgen/config.py)
      - key: LEADGEN_SMTP_USER       # the address that emails problem alerts (e.g. a Gmail
        sync: false                  # address); see docs/operator-runbook.md, owner item 7
      - key: LEADGEN_SMTP_PASSWORD   # its password (for Google: an app password)
        sync: false
      - key: GOOGLE_PLACES_API_KEY   # optional
        sync: false
      - key: YELP_API_KEY            # optional
        sync: false
      - key: DATABASE_URL            # the permanent database (e.g. a free Neon Postgres):
        sync: false                  # saved leads, baler marks, the daily Yelp count
