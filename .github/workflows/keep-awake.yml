# Render's free plan puts the site to sleep after 15 minutes with no visitors, and the
# next visitor waits 20 to 60 seconds while it wakes. What keeps it awake from 6 AM to
# 9 PM Utah time is an outside pinger that opens /healthz every 5 minutes (cron-job.org
# or UptimeRobot: docs/operator-runbook.md, "Keep the site awake", an owner step), and
# the site reports under Recent problems when it had gone to sleep anyway (leadgen/awake.py).
#
# This job is the backup. GitHub starts scheduled jobs late and skips many (from
# 2026-09-30 to 2026-10-03 it ran this one about every 4 hours instead of every 10
# minutes), so each run that does start keeps the site awake for the next 50 minutes:
# it opens /healthz every 5 minutes, and stops outside Utah working hours.
name: Keep the site awake

on:
  schedule:
    # Every 15 minutes, at minutes GitHub is less busy than on the hour, from 12:00 to
    # 03:59 UTC (6 AM to 9 PM Utah time in summer and winter; the job checks Utah time).
    - cron: "7,22,37,52 12-23,0-3 * * *"
  workflow_dispatch:

# One run at a time: a run that starts while another is still pinging waits for it.
concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      SITE: https://compactor-lead-finder.onrender.com/healthz
      MINUTES: "50"     # how long one run keeps the site awake
      EVERY: "300"      # seconds between pings (Render sleeps after 15 idle minutes)
    steps:
      - name: Open /healthz every 5 minutes during Utah working hours
        run: |
          start=$(date +%s); ok=0; missed=0
          utah() { TZ=America/Denver date "$@"; }
          while [ $(( $(date +%s) - start )) -lt $(( MINUTES * 60 )) ]; do
            hour=$(utah +%-H)
            if [ "$hour" -lt 6 ] || [ "$hour" -ge 21 ]; then
              echo "It is $(utah '+%-I:%M %p') in Utah, outside 6 AM to 9 PM: stopping."
              break
            fi
            began=$(date +%s)
            # A sleeping site takes up to a minute to answer; retry a refused or cut-off try.
            if curl -fsS -o /dev/null -m 90 --retry 3 --retry-delay 10 --retry-all-errors \
                 -w "$(utah '+%-I:%M %p') Utah time: HTTP %{http_code} in %{time_total} s\n" "$SITE"; then
              ok=$((ok + 1))
            else
              missed=$((missed + 1))
              echo "::warning::The site didn't answer at $(utah '+%-I:%M %p') Utah time."
            fi
            wait=$(( EVERY - ($(date +%s) - began) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
          echo "Answered: $ok. Didn't answer: $missed."
          if [ "$missed" -gt 0 ] && [ "$ok" -eq 0 ]; then
            echo "::error::The site didn't answer at all during this run."
            exit 1
          fi
