# Render's free plan puts the site to sleep after 15 minutes with no visitors, and the
# next visitor waits about 30 seconds while it wakes. This opens /healthz (public, holds
# no data) every 10 minutes during Utah working hours so the site stays awake for the
# team. One always-on free service fits in Render's 750 free hours a month.
name: Keep the site awake

on:
  schedule:
    # Every 10 minutes, 6 AM to 9 PM Utah time (12:00 to 03:59 UTC, covers MDT and MST).
    - cron: "*/10 12-23,0-3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 --retry 2 https://compactor-lead-finder.onrender.com/healthz
