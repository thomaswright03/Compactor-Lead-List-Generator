# Not scheduled any more: since 2026-10-07 the site runs on Render's Starter plan, which
# never sleeps. Kept to run by hand (Actions > Keep the site awake > Run workflow) if the
# site is ever put back on the free plan, which sleeps after 15 minutes with no visitors;
# then also put the schedule back:
#   schedule:
#     - cron: "7,22,37,52 12-23,0-3 * * *"   # every 15 minutes, 6 AM to 9 PM Utah time
# Each run opens /healthz every 5 minutes for 50 minutes, during Utah working hours.
name: Keep the site awake

on:
  workflow_dispatch:

# One run at a time: a run that starts while another is still pinging waits for it.
concurrency:
  group: keep-awake
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      SITE: https://compactor-lead-finder.onrender.com/healthz
      MINUTES: "50"     # how long one run keeps the site awake
      EVERY: "300"      # seconds between pings (Render sleeps after 15 idle minutes)
    steps:
      - name: Open /healthz every 5 minutes during Utah working hours
        run: |
          start=$(date +%s); ok=0; missed=0
          utah() { TZ=America/Denver date "$@"; }
          while [ $(( $(date +%s) - start )) -lt $(( MINUTES * 60 )) ]; do
            hour=$(utah +%-H)
            if [ "$hour" -lt 6 ] || [ "$hour" -ge 21 ]; then
              echo "It is $(utah '+%-I:%M %p') in Utah, outside 6 AM to 9 PM: stopping."
              break
            fi
            began=$(date +%s)
            # A sleeping site takes up to a minute to answer; retry a refused or cut-off try.
            if curl -fsS -o /dev/null -m 90 --retry 3 --retry-delay 10 --retry-all-errors \
                 -w "$(utah '+%-I:%M %p') Utah time: HTTP %{http_code} in %{time_total} s\n" "$SITE"; then
              ok=$((ok + 1))
            else
              missed=$((missed + 1))
              echo "::warning::The site didn't answer at $(utah '+%-I:%M %p') Utah time."
            fi
            wait=$(( EVERY - ($(date +%s) - began) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
          echo "Answered: $ok. Didn't answer: $missed."
          if [ "$missed" -gt 0 ] && [ "$ok" -eq 0 ]; then
            echo "::error::The site didn't answer at all during this run."
            exit 1
          fi
