# A copy of the live database once a day, older than Neon's own history reaches (6 hours
# on the free plan): `python -m leadgen backup` (every saved lead, Yes / No mark, call and
# search, with who made each), encrypted with the owner's passphrase and kept as this run's
# artifact for 90 days. The repository is public, so the copy is only ever stored
# encrypted (AES-256, gpg); without the passphrase it can't be read.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
# BACKUP_DATABASE_URL (the Neon connection string, the same as Render's DATABASE_URL)
# and BACKUP_PASSPHRASE (a long passphrase kept in the owner's password manager). If one
# is missing, the nightly (scheduled) run fails, red, naming the missing secret, so a
# lost or mistyped secret shows on the Actions page and in GitHub's failed-run email; a
# run started by hand only says so and stays green. Restoring a copy, and the "Restore
# rehearsal" workflow that proves a copy restores: docs/operator-runbook.md, "Backups
# and restoring". The job never changes the database.
name: Nightly backup

on:
  schedule:
    # Once a day. Asked for at 3:15 AM Utah time in summer (2:15 AM in winter), but GitHub
    # often starts scheduled runs hours late, usually by late morning Utah time (from
    # 2026-10-03 to 10-08 they started between 8:19 AM and 12:29 PM), so a copy can hold
    # part of a working morning. The step "Copy the database" prints the copy's exact
    # time, and the copy keeps it ("made", docs/operator-runbook.md, Backups and restoring).
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the two secrets are set
        id: ready
        run: |
          missing=""
          if [ -z "$DATABASE_URL" ]; then missing="BACKUP_DATABASE_URL"; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then missing="${missing:+$missing and }BACKUP_PASSPHRASE"; fi
          if [ -n "$missing" ]; then
            case "$missing" in
              *" and "*) what="secrets $missing are"; it="them" ;;
              *) what="secret $missing is"; it="it" ;;
            esac
            message="No backup was made: the repository $what missing. Add $it on GitHub: the repository > Settings > Secrets and variables > Actions > New repository secret (docs/operator-runbook.md, Backups and restoring)."
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              # A nightly run that saved nothing must not look green.
              echo "::error::$message"
              exit 1
            fi
            echo "::notice::$message"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "day=$(TZ=America/Denver date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.on == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.on == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.ready.outputs.on == 'true'
        run: pip install -r requirements.txt
      - name: Copy the database (prints only counts)
        if: steps.ready.outputs.on == 'true'
        run: python -m leadgen backup --out "$RUNNER_TEMP/backup.json.gz"
      - name: Encrypt the copy (the plain copy never leaves the runner)
        if: steps.ready.outputs.on == 'true'
        run: |
          mkdir -p out
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "out/leadgen-backup-${{ steps.ready.outputs.day }}.json.gz.gpg" "$RUNNER_TEMP/backup.json.gz"
          rm -f "$RUNNER_TEMP/backup.json.gz"
      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.on == 'true'
        with:
          name: leadgen-backup-${{ steps.ready.outputs.day }}
          path: out/*.gpg
          retention-days: 90
          if-no-files-found: error
