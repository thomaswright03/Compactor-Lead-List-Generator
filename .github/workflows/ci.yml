# Runs on every push and pull request: lint, the dead-code check and the type check (of the
# Python and of the page's scripts), then the whole
# test suite on SQLite and on Postgres (like the live site), including the browser
# tests. Render deploys a push to main only once all three jobs (lint, test (sqlite),
# test (postgres)) are green (render.yaml: autoDeployTrigger: checksPass); a red commit
# is never deployed. Check /healthz afterwards (docs/operator-runbook.md, "Deploying",
# which also has the steps for protecting main so these jobs are required). When a job
# fails, its last step (Email the owner) emails the owner; on success it is skipped. It is a
# step, not a separate job, so a green run has no skipped check (Render deploys only when
# every check passed). It needs the repository secrets LEADGEN_SMTP_USER and
# LEADGEN_SMTP_PASSWORD (docs/operator-runbook.md, "Owner actions still open", item 7);
# without them it only prints a notice.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt        # the app's packages too, for the type check
      - run: ruff check .
      - run: vulture                                   # settings in pyproject.toml
      - run: mypy                                      # settings in pyproject.toml
      # The page's scripts (leadgen/static/*.js): lint and type check, with the exact tool
      # versions in package-lock.json (the site itself needs no Node).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:js                           # settings in eslint.config.mjs
      - run: npm run types:js                          # settings in tsconfig.json
      # Emails the owner when a step above failed (leadgen/mail.py; see the note at the top).
      - name: Email the owner
        if: failure()
        env:
          LEADGEN_SMTP_USER: ${{ secrets.LEADGEN_SMTP_USER }}
          LEADGEN_SMTP_PASSWORD: ${{ secrets.LEADGEN_SMTP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          PUSHED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 leadgen/mail.py --subject "Lead Finder: $WORKFLOW failed on $BRANCH" \
            "The GitHub workflow \"$WORKFLOW\" failed on the branch $BRANCH." \
            "" \
            "Commit: $COMMIT" \
            "Started by: $PUSHED_BY" \
            "The run (which step failed, and its log): $RUN_URL"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only        # a throwaway database that lives for this run
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEADGEN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci-only@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests (browser tests must run, not skip)
        run: |
          python -m pytest -q -rs | tee pytest.log
          # Only a Postgres-only test may skip, and only in the SQLite job.
          if grep "SKIPPED" pytest.log | grep -v "needs LEADGEN_TEST_DATABASE_URL"; then exit 1; fi
          if [ -n "$LEADGEN_TEST_DATABASE_URL" ] && grep -q "SKIPPED" pytest.log; then exit 1; fi
      # The tests keep their cache and database in a temporary folder (tests/conftest.py).
      - name: The tests wrote no cache into the working copy
        run: test ! -e .cache
      # Emails the owner when a step above failed (leadgen/mail.py; see the note at the top).
      - name: Email the owner
        if: failure()
        env:
          LEADGEN_SMTP_USER: ${{ secrets.LEADGEN_SMTP_USER }}
          LEADGEN_SMTP_PASSWORD: ${{ secrets.LEADGEN_SMTP_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
          PUSHED_BY: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 leadgen/mail.py --subject "Lead Finder: $WORKFLOW failed on $BRANCH" \
            "The GitHub workflow \"$WORKFLOW\" failed on the branch $BRANCH." \
            "" \
            "Commit: $COMMIT" \
            "Started by: $PUSHED_BY" \
            "The run (which step failed, and its log): $RUN_URL"
