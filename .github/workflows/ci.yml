# Runs on every push and pull request: lint, the dead-code check and the type check (of the
# Python and of the page's scripts), then the whole
# test suite on SQLite and on Postgres (like the live site), including the browser
# tests. Render deploys a push to main only once all three jobs (lint, test (sqlite),
# test (postgres)) are green (render.yaml: autoDeployTrigger: checksPass); a red commit
# is never deployed. Check /healthz afterwards (docs/operator-runbook.md, "Deploying",
# which also has the steps for protecting main so these jobs are required).
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt        # the app's packages too, for the type check
      - run: ruff check .
      - run: vulture                                   # settings in pyproject.toml
      - run: mypy                                      # settings in pyproject.toml
      # The page's scripts (leadgen/static/*.js): lint and type check, with the exact tool
      # versions in package-lock.json (the site itself needs no Node).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint:js                           # settings in eslint.config.mjs
      - run: npm run types:js                          # settings in tsconfig.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only        # a throwaway database that lives for this run
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEADGEN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci-only@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests (browser tests must run, not skip)
        run: |
          python -m pytest -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log
      # The tests keep their cache and database in a temporary folder (tests/conftest.py).
      - name: The tests wrote no cache into the working copy
        run: test ! -e .cache
