# Runs on every push and pull request: lint, the dead-code check and the type check, then the whole
# test suite on SQLite and on Postgres (like the live site), including the browser
# tests. Render deploys a commit on main only after these checks pass (render.yaml,
# autoDeployTrigger: checksPass), and branch protection on main requires all three jobs
# (README, "Deploying"). live.yml checks afterwards that the site runs the latest commit.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt        # the app's packages too, for the type check
      - run: ruff check .
      - run: vulture                                   # settings in pyproject.toml
      - run: mypy                                      # settings in pyproject.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only        # a throwaway database that lives for this run
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEADGEN_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:ci-only@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests (browser tests must run, not skip)
        run: |
          python -m pytest -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log
